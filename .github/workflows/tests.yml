name: Run Playwright Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright
        run: python -m playwright install --with-deps

      - name: Run Pytest
        run: pytest --clean-alluredir --alluredir=allure-results

      - name: Upload Allure Results (raw)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results

      - name: Generate Allure Report
        if: always()
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/allure-results:/app/allure-results \
            -v ${{ github.workspace }}/allure-report:/app/allure-report \
            ghcr.io/allure-framework/allure2:latest \
            allure generate /app/allure-results -o /app/allure-report --clean

      - name: Upload Allure Report HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report
